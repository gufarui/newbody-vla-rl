# Kinova3 + PickPlaceCan. Milestone 1 config.
env:
  robot: Kinova3
  arm_controller: OSC_POSITION      # action = [dx, dy, dz, gripper] in [-1, 1]; 1.0 = 5 cm target offset
  hold_orientation: true            # keep gripper pointing down (see pick_place_env.py)
  control_freq: 20                  # Hz
  horizon: 300                      # max policy steps per episode (15 s)
  camera_names: [agentview, robot0_eye_in_hand]
  camera_size: 256
  # Stock robosuite: bin1 (0.1, -0.25, 0.8), bin2 (0.1, 0.28, 0.8). Shifted 15 cm toward the robot
  # because the stock target compartment is at the edge of Kinova3's vertical-gripper workspace.
  bin1_pos: [-0.05, -0.25, 0.8]
  bin2_pos: [-0.05, 0.28, 0.8]
  # Can start region relative to bin1 center (m). Stock: whole bin (+-0.145, +-0.195).
  can_x_range: [-0.08, 0.08]
  can_y_range: [-0.10, 0.10]

success:
  hold_steps: 10                    # can in target compartment AND released, for this many consecutive steps

expert:
  approach_height: 0.10             # hover above can center before descending (m)
  grasp_z_offset: 0.0               # eef target z relative to can body center when grasping
  carry_z: 1.00                     # absolute eef z while carrying; bin walls top at 0.90, can bottom = eef - 0.06 -> 4 cm clearance
  move_xy_tolerance: 0.03           # start lowering once within 3 cm of the point above the target
  release_z_above_floor: 0.09       # eef z above bin2 floor when opening the gripper
  action_gain: 1.0                  # action = clip(gain * pos_error / 0.05)
  xy_tolerance: 0.01
  z_tolerance: 0.01
  gripper_steps: 10                 # steps to wait while closing / opening the gripper
  phase_timeout: 80                 # max steps in any phase -> failure

# Milestone 1 demonstration collection. Seed ranges never overlap (no initial-state leakage).
data:
  task: "Pick up the can and place it in the target bin."
  splits:
    train: {seed_start: 0, episodes: 50}
    val: {seed_start: 100000, episodes: 10}
    test: {seed_start: 200000}      # closed-loop evaluation only, never recorded

# Milestone 3: residual SAC on the frozen SFT VLA (design: docs/m3_design.md)
rl:
  vla_checkpoint: outputs/sft_v1/checkpoints/010000/pretrained_model
  can_x_range: [-0.145, 0.145]      # full source bin (same distribution as the final test)
  can_y_range: [-0.195, 0.195]
  train_seed_start: 400000          # disjoint from demos (0+), val (100000+), test (200000+)
  val_seed_start: 450000            # RL checkpoint selection only
  val_episodes: 40
  total_episodes: 1500
  learning_starts: 300              # transitions collected with the initial (≈ SFT) policy before updates
  updates_per_transition: 4         # transitions are expensive (1 VLA call + 10 sim steps); updates are cheap
  buffer_size: 100000
  eval_every_episodes: 250
  save_every_episodes: 50
  residual:
    chunk_steps: 10
    residual_scale: 0.2
    residual_penalty: 0.005
    success_reward: 1.0
    max_decisions: 30
    tip_cos_threshold: 0.5
  sac:
    feature_proj: 128
    hidden: 256
    gamma: 0.98
    tau: 0.005
    policy_lr: 0.0003
    q_lr: 0.001
    batch_size: 256
    policy_frequency: 2
    init_log_std: -1.2
    alpha: 0.01                     # initial entropy temperature (auto-tuned); 0.05 made early exploration dominate
    actor_warmup_updates: 2000      # critic-only first (~500 transitions): actor drifted to |δ|~0.6 on an untrained critic
