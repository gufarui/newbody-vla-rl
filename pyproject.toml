[project]
name = "newbody-vla-rl"
version = "0.1.0"
description = "Cross-embodiment VLA adaptation (SmolVLA -> simulated Kinova3) with frozen-VLA residual RL, MuJoCo/robosuite only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "robosuite==1.5.2",
    # Pinned on purpose (verified 2026-11-22):
    #  - mujoco 4.x: robosuite 1.5.2 crashes (AssertionError in get_joint_qpos_addr)
    #  - mujoco 3.9.0: runs, but Robotiq85 cannot close below ~6.3 cm (3.3.7: 1.5 cm) -> silent grasp failures
    "mujoco==3.3.7",
    "numpy<2.3",
    "pyyaml",
    "imageio",
    "imageio-ffmpeg",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newbody"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
